# Example: MySQL → Doris Stream Load
name: orders-to-doris
mode: incremental
source:
  type: mysql
  url: jdbc:mysql://127.0.0.1:3306/oltp?useSSL=false&serverTimezone=UTC
  user: sync_reader
  password: change-me
  read:
    mode: table
    table: orders
    columns: [id, user_id, status, amount, update_time]
    primaryKey: [id]
    incremental:
      strategy: update_time_id
      column: update_time
      idColumn: id
      overlap: 5m
target:
  type: doris
  feHost: 127.0.0.1
  fePort: 8030
  database: dw
  table: ods_orders
  user: root
  password: ""
  primaryKey: [id]
  writeMode: merge
state:
  type: jdbc
  url: jdbc:mysql://meta:3306/weir_meta
  user: weir
  password: change-me
